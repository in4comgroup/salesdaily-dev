# Build the Next.js standalone image, push it to GHCR and deploy it to the
# dev cluster (h3llo, dev.salesdaily.ru).
#
# Push to main:
#   build runs automatically and pushes the image. Nothing is deployed.
#
# Deploy = Actions → build-and-deploy → Run workflow:
#   • release engineer, image already built (main): just press the green
#     "Run workflow" button — defaults are build=off, deploy=on, tag empty,
#     and it deploys the image built from the latest commit of the branch;
#   • new branch, nothing built yet: tick build as well → build, then deploy;
#   • rollback: build=off, deploy=on, tag=<past tag>;
#   • only build a branch: build=on, deploy=off.
#
# Tags pushed by the build:
#   ghcr.io/<owner>/<repo>:dev-sha-<short>  — every build (immutable; deploy THIS)
#   ghcr.io/<owner>/<repo>:dev-<branch>     — moving tag per branch
#
# The `dev-` prefix matters: NEXT_PUBLIC_* are baked in at build time, so a
# dev image (dev.salesdaily.ru) must never be deployed to prod.
#
# Settings → Environments → dev:
#   variables NEXT_PUBLIC_APP_URL         (required — build arg + health check)
#             NEXT_PUBLIC_PRODUCTION_URL  (optional)
#   secrets   KUBE_SERVER   API server URL
#             KUBE_CA_DATA  cluster CA, base64 (certificate-authority-data)
#             KUBE_TOKEN    the ServiceAccount token
# NEXT_PUBLIC_* are baked into the client bundle at build time — changing
# them means a rebuild, not a pod restart.
#
# Cluster access: ServiceAccount `github-deployer` (deploy/k8s/infra/
# github-deployer.yaml — namespace-scoped, no delete, no Secrets).
# Setup: docs/deploy/ci-deploy.md.
#
# The tag is written into kustomization.yaml on the runner only — the file in
# git is NOT the source of truth for what runs. Don't `kubectl apply -k` from
# a laptop: it would roll the cluster back to whatever tag the file holds.

name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build:
        description: "Build and push the image for the selected branch (needed for a branch that has no image yet)"
        type: boolean
        default: false
      deploy:
        description: "Deploy to dev (manifests from the selected branch)"
        type: boolean
        default: true
      tag:
        description: "Image tag to deploy (empty = dev-sha-<commit of the selected branch>; a past tag = rollback)"
        type: string
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  migration-check:
    uses: ./.github/workflows/migrations.yml

  build:
    # Auto on push to main; on manual runs only if the box is ticked.
    if: github.event_name == 'push' || inputs.build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # NEXT_PUBLIC_* live in the GitHub Environment `dev` (Settings →
    # Environments), not as repository variables.
    environment: dev
    concurrency:
      group: docker-image-${{ github.ref }}
      cancel-in-progress: true
    steps:
      # Private-repo runners have ~7 GB RAM; `next build` peaks near that.
      # Extra swap turns an OOM kill into a slower build.
      - name: Add swap
        run: |
          sudo swapoff -a
          sudo fallocate -l 10G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - uses: actions/checkout@v4

      - name: Check build variables
        env:
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
        run: |
          if [ -z "$NEXT_PUBLIC_APP_URL" ]; then
            echo "::error::Variable NEXT_PUBLIC_APP_URL is not set in GitHub Environment dev"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=dev-sha-
            type=ref,event=branch,prefix=dev-

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_PRODUCTION_URL=${{ vars.NEXT_PUBLIC_PRODUCTION_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    # Manual runs only. A skipped build is fine (image already exists /
    # rollback); a failed or cancelled one blocks the deploy.
    needs: [build, migration-check]
    if: >-
      !cancelled() && github.event_name == 'workflow_dispatch' && inputs.deploy &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      needs.migration-check.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: dev
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    env:
      KUSTOMIZE_VERSION: "5.4.3"
      KUBECTL_VERSION: "v1.32.3"
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image
        id: image
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          repo="${GITHUB_REPOSITORY,,}"   # GHCR names are lowercase
          tag="${INPUT_TAG:-dev-sha-${GITHUB_SHA::7}}"
          echo "ref=ghcr.io/${repo}:${tag}" >> "$GITHUB_OUTPUT"
          echo "name=ghcr.io/${repo}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Image: ghcr.io/${repo}:${tag}"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the image exists
        run: |
          if ! docker buildx imagetools inspect "${{ steps.image.outputs.ref }}" > /dev/null; then
            echo "::error::Image ${{ steps.image.outputs.ref }} not found — run this workflow with build=on for this branch first"
            exit 1
          fi

      - uses: azure/setup-kubectl@v4
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Install kustomize
        run: |
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kustomize
          kustomize version

      - name: Kubeconfig
        env:
          KUBE_SERVER: ${{ secrets.KUBE_SERVER }}
          KUBE_CA_DATA: ${{ secrets.KUBE_CA_DATA }}
          KUBE_TOKEN: ${{ secrets.KUBE_TOKEN }}
        run: |
          for v in KUBE_SERVER KUBE_CA_DATA KUBE_TOKEN; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret $v is not set in GitHub Environment dev (docs/deploy/ci-deploy.md)"
              exit 1
            fi
          done
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          echo "$KUBE_CA_DATA" | base64 -d > "$RUNNER_TEMP/ca.crt"
          kubectl config set-cluster dev --server="$KUBE_SERVER" --certificate-authority="$RUNNER_TEMP/ca.crt" --embed-certs=true
          kubectl config set-credentials github-deployer --token="$KUBE_TOKEN"
          kubectl config set-context dev --cluster=dev --user=github-deployer --namespace=salesdaily
          kubectl config use-context dev
          rm "$RUNNER_TEMP/ca.crt"
          echo "KUBECONFIG=$KUBECONFIG" >> "$GITHUB_ENV"
          # Fails fast (and readably) if the runner can't reach the API server
          # or the token is wrong — before anything is changed.
          kubectl get deploy crm -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'

      - name: Resolve immutable release digest
        id: release
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE_REF" --format '{{json .Manifest.Digest}}' | tr -d '"')
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || exit 1
          echo "ref=${IMAGE_REF%:*}@$digest" >> "$GITHUB_OUTPUT"

      - name: Migrate database before rollout
        env:
          MIGRATION_IMAGE: ${{ steps.release.outputs.ref }}
          MIGRATION_JOB: crm-migrate-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash scripts/migrations/deploy.sh

      - name: Apply manifests
        run: |
          cd deploy/k8s/app
          # Whatever the image is named in the manifests → this repo's image + tag.
          kustomize edit set image "ghcr.io/artuomvproskunin/ru-crm-v1=${{ steps.release.outputs.ref }}"
          cd -
          kubectl apply -k deploy/k8s/app

      - name: Wait for rollout
        run: kubectl rollout status deploy/crm --timeout=10m

      - name: Health check
        env:
          APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS -m 10 "$APP_URL/api/health"; then echo; exit 0; fi
            sleep 10
          done
          echo "::error::$APP_URL/api/health did not answer 200"
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deploy to dev"
            echo "- Image: \`${{ steps.image.outputs.ref }}\`"
            echo "- Branch: \`${GITHUB_REF_NAME}\` (\`${GITHUB_SHA::7}\`)"
            echo "- Running now: \`$(kubectl get deploy crm -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || echo unknown)\`"
          } >> "$GITHUB_STEP_SUMMARY"